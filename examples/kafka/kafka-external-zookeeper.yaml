apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-kafka-cluster
  namespace: myproject
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.7"
    storage:
      type: jbod
      volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
    # External ZooKeeper configuration - replaces internal ZooKeeper
    externalZooKeeper:
      connect: "zk-1.example.com:2181,zk-2.example.com:2181,zk-3.example.com:2181"
      tls: false  # Set to true if your external ZooKeeper uses TLS
      config:
        # Optional: Additional ZooKeeper-specific configuration
        zookeeper.session.timeout.ms: 18000
        zookeeper.connection.timeout.ms: 16000
  # NOTE: No zookeeper section is specified when using external ZooKeeper
  # zookeeper: null  # This would be omitted entirely
  entityOperator:
    topicOperator: {}
    userOperator: {}